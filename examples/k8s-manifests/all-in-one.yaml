apiVersion: v1
kind: Namespace
metadata:
  name: coffee-shop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-config
  namespace: coffee-shop
data:
  APP_MESSAGE: "Selam! Ben Kubernetes üzerinde çalışan bir Spring Boot mikroservisiyim! 🚀"
  SPRING_PROFILES_ACTIVE: "prod"
---
apiVersion: v1
kind: Secret
metadata:
  name: spring-boot-secret
  namespace: coffee-shop
type: Opaque
stringData:
  DB_PASSWORD: "SuperSecretPassword123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-deployment
  namespace: coffee-shop
  labels:
    app: coffee-app
spec:
  replicas: 3 # ELI5: Aynı anda 3 garson (pod) çalışsın
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # Güncellemede en fazla 1 ekstra pod aç
      maxUnavailable: 0 # Sıfır kesinti: Hiçbir çalışan pod aynı anda kapatılamaz!
  selector:
    matchLabels:
      app: coffee-app
  template:
    metadata:
      labels:
        app: coffee-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: coffee-container
          image: ghcr.io/eli5-k8s/spring-boot-k8s-eli5:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: spring-boot-config
            - secretRef:
                name: spring-boot-secret
          resources:
            requests:
              cpu: "100m" # 0.1 CPU çekirdeği garanti et
              memory: "256Mi"
            limits:
              cpu: "500m" # En fazla 0.5 CPU çekirdeği kullanabilir
              memory: "512Mi" # 512MB aşarsa OOMKilled olur!
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 2 # JVM başlayana kadar 60 saniye sabret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3 # 3 kez başarısız olursa pod'u yeniden başlat (restart)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2 # Başarısız olursa Servis trafiğini kes!
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-service
  namespace: coffee-shop
spec:
  type: ClusterIP
  selector:
    app: coffee-app
  ports:
    - port: 80
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coffee-ingress
  namespace: coffee-shop
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: coffee.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coffee-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coffee-hpa
  namespace: coffee-shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-boot-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

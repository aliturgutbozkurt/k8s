server:
  port: 8080
  shutdown: graceful # ELI5: K8s SIGTERM gönderince mevcut siparişleri tamamlamadan kapanma!

spring:
  application:
    name: spring-boot-k8s-eli5
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true # ELI5: K8s /actuator/health/liveness ve /actuator/health/readiness aktif eder!

app:
  message: "Hello from Kubernetes & GitOps Masterclass!"
  version: "1.0.0"

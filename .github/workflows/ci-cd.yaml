name: Enterprise Java Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/spring-boot-k8s-eli5

jobs:
  # STAGE 1: Test & Build
  build-and-test:
    name: ☕ Maven Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit & Integration Tests
        run: |
          cd examples/spring-boot-app
          mvn clean test

      - name: Package JAR
        run: |
          cd examples/spring-boot-app
          mvn package -DskipTests

  # STAGE 2: Containerize & Security Scan
  docker-build-and-scan:
    name: 🐳 Docker Build & Trivy Vulnerability Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./examples/spring-boot-app
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Kritik açıkları raporla
          severity: 'CRITICAL,HIGH'

      - name: Push Image to Registry
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # STAGE 3: GitOps Automation (Flux Repository Update)
  gitops-promote:
    name: 🚀 GitOps Auto-Commit to Flux Fleet
    needs: docker-build-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Fleet Repository
        uses: actions/checkout@v4
        with:
          repository: 'my-org/k8s-gitops-fleet'
          token: ${{ secrets.GITOPS_DEPLOY_PAT }}
          path: gitops-repo

      - name: Update Image Tag in Kustomization
        run: |
          cd gitops-repo/clusters/production/coffee-app
          # ELI5: K8s manifestosundaki image etiketini yeni derlenen SHA ile güncelle
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "chore(release): auto-promote coffee-app to version ${{ github.sha }}"
          git push origin main
